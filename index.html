<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertiFarm — Grown honest. Verified by neighbours.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0E1;
    --paper-2:#E4E6D2;
    --card:#F6F7EE;
    --ink:#1D2419;
    --ink-soft:#57604C;
    --ink-faint:#8A9078;
    --leaf:#2F5233;
    --leaf-deep:#1F3823;
    --leaf-soft:#DCE5D4;
    --ochre:#B9812A;
    --ochre-soft:#F2E3C2;
    --clay:#9C4530;
    --clay-soft:#F0DCD3;
    --line:#CBC6A9;
    --line-soft:#DAD7BF;
    --radius:5px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 64px;
  }

  /* ---------- header ---------- */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .mark{
    width:30px;height:30px;border-radius:50%;
    background:var(--leaf);
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:var(--font-display);font-size:15px;font-weight:600;
    flex:none;
  }
  .wordmark h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .wordmark .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .header-right{
    text-align:right;
    font-size:12px;
    color:var(--ink-faint);
    max-width:280px;
  }

  /* ---------- mode switch ---------- */
  .mode-switch{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
    margin-bottom:18px;
    background:var(--card);
  }
  .mode-btn{
    border:none;
    background:none;
    padding:7px 16px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    border-radius:16px;
  }
  .mode-btn.active{background:var(--leaf);color:var(--paper);}
  .mode-btn:not(.active):hover{color:var(--leaf-deep);}
  .mode-note{
    font-size:12px;
    color:var(--ink-faint);
    margin:-10px 0 18px;
  }

  /* ---------- stats strip ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:26px;
  }
  .stat{
    background:var(--card);
    padding:14px 16px;
  }
  .stat .n{
    font-family:var(--font-display);
    font-size:24px;
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .stat .l{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:28px;
    align-items:start;
  }

  /* ---------- nav ---------- */
  .steps{
    position:relative;
    padding-left:2px;
  }
  .steps::before{
    content:"";
    position:absolute;
    left:15px;top:20px;bottom:20px;
    width:1px;
    background:var(--line);
  }
  .step{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 8px;
    border-radius:var(--radius);
    cursor:pointer;
    background:transparent;
    border:1px solid transparent;
    width:100%;
    text-align:left;
  }
  .step:hover{background:var(--paper-2);}
  .step.active{background:var(--card);border-color:var(--line);}
  .step .dot{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:13px;
    color:var(--ink-soft);
    z-index:1;
  }
  .step.active .dot{background:var(--leaf);border-color:var(--leaf);color:var(--paper);}
  .step.done .dot{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep);}
  .step .txt .name{font-size:13.5px;font-weight:600;}
  .step .txt .desc{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .step.active .txt .name{color:var(--leaf-deep);}

  .seed-btn{
    margin-top:20px;
    width:100%;
    background:none;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:9px 10px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .seed-btn:hover{border-color:var(--ochre);color:var(--ochre);}

  /* ---------- main panel ---------- */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px;
    min-height:420px;
  }
  .panel h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    margin:0 0 4px;
  }
  .panel .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 20px;
    max-width:540px;
  }

  .grid-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:18px;
    max-width:560px;
  }
  .field{display:flex;flex-direction:column;gap:5px;position:relative;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:4px;
    padding:8px 10px;
    color:var(--ink);
    width:100%;
  }
  .field .hint{font-size:10.5px;color:var(--ink-faint);}
  .field input:focus, .field select:focus, .step:focus-visible, button:focus-visible{
    outline:2px solid var(--ochre);
    outline-offset:1px;
  }
  .primary-btn{
    background:var(--leaf);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-size:13px;
    font-weight:600;
  }
  .primary-btn:hover{background:var(--leaf-deep);}
  .primary-btn:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed;}
  .ghost-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .ghost-btn:hover{border-color:var(--leaf);color:var(--leaf-deep);}

  .empty{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:24px;
    color:var(--ink-faint);
    font-size:13px;
    text-align:center;
  }

  /* row lists */
  .rows{display:flex;flex-direction:column;gap:8px;}
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border:1px solid var(--line-soft);
    background:var(--paper);
    border-radius:4px;
    padding:10px 12px;
  }
  .row .meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .row .name{font-size:13.5px;font-weight:600;}
  .badge{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    flex:none;
  }
  .badge.pending{background:var(--clay-soft);color:var(--clay);}
  .badge.verified{background:var(--leaf-soft);color:var(--leaf-deep);}
  .badge.gold{background:var(--ochre-soft);color:var(--ochre);}

  .checkline{display:flex;align-items:center;gap:8px;}
  .checkline input{width:16px;height:16px;accent-color:var(--leaf);}

  /* label card + qr */
  .label-card{
    display:flex;
    gap:20px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:18px;
    max-width:540px;
    align-items:center;
  }
  .qr{
    flex:none;
    width:88px;height:88px;
    background:var(--card);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .qr img, .qr canvas, .qr table{display:block;}
  .qr-note{font-size:10px;color:var(--ink-faint);margin-top:4px;}
  .label-card .id{font-family:var(--font-display);font-size:18px;letter-spacing:.01em;}
  .label-card .desc{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  /* trace view */
  .trace-search{display:flex;gap:8px;max-width:520px;margin-bottom:20px;position:relative;}
  .trace-search input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:9px 12px;}
  .trace-result{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:20px;max-width:640px;}
  .trace-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line-soft);padding-bottom:14px;margin-bottom:14px;}
  .trace-head .id{font-family:var(--font-display);font-size:22px;}
  .trust-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .trust-item{display:flex;gap:8px;font-size:12.5px;color:var(--ink-soft);align-items:flex-start;}
  .trust-item .tick{color:var(--leaf);flex:none;font-weight:700;}
  .farm-card{border:1px solid var(--line-soft);border-radius:4px;padding:10px 12px;margin-bottom:8px;}
  .farm-card .name{font-weight:600;font-size:13.5px;}
  .farm-card .meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .grow-strip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .grow-thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;border:1px solid var(--line-soft);}
  .grow-thumb.placeholder{display:flex;align-items:center;justify-content:center;background:var(--leaf-soft);font-size:16px;}
  .custody{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:14px;}
  .custody .hop{background:var(--leaf-soft);color:var(--leaf-deep);padding:4px 9px;border-radius:20px;}
  .custody .arrow{color:var(--ink-faint);}

  .quick-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .quick-picks button{
    background:var(--paper-2);
    border:1px solid var(--line-soft);
    border-radius:20px;
    padding:5px 11px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .quick-picks button:hover{border-color:var(--ochre);color:var(--ochre);}

  .section-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:20px 0 8px;}

  /* growth journal */
  .grow-form-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px;max-width:640px;}
  .photo-input{
    border:1px dashed var(--line);
    border-radius:4px;
    padding:10px;
    background:var(--paper);
    font-size:12px;
    color:var(--ink-soft);
    width:100%;
  }
  .photo-preview{
    width:64px;height:64px;
    border-radius:4px;
    object-fit:cover;
    border:1px solid var(--line);
    display:none;
  }
  .grow-card{
    display:flex;
    gap:12px;
    border:1px solid var(--line-soft);
    background:var(--paper);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
    align-items:center;
  }
  .grow-card .thumb{width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none;border:1px solid var(--line-soft);}
  .grow-card .thumb.placeholder{background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* ---------- farmer view ---------- */
  .farmer-pick{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 8px;
    border-radius:var(--radius);
    cursor:pointer;
    background:transparent;
    border:1px solid transparent;
    width:100%;
    text-align:left;
  }
  .farmer-pick:hover{background:var(--paper-2);}
  .farmer-pick.active{background:var(--card);border-color:var(--leaf);}
  .farmer-pick .avatar{
    flex:none;width:30px;height:30px;border-radius:50%;
    background:var(--ochre-soft);color:var(--ochre);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:13px;font-weight:600;
  }
  .farmer-pick.active .avatar{background:var(--leaf);color:var(--paper);}
  .farmer-pick .name{font-size:13.5px;font-weight:600;}
  .farmer-pick .desc{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .logout-btn{
    margin-top:16px;width:100%;background:none;border:1px solid var(--line);
    border-radius:var(--radius);padding:8px 10px;font-size:12px;color:var(--ink-soft);
  }
  .logout-btn:hover{border-color:var(--clay);color:var(--clay);}
  .privacy-note{
    display:flex;gap:8px;align-items:flex-start;
    background:var(--leaf-soft);color:var(--leaf-deep);
    border-radius:4px;padding:10px 12px;
    font-size:12px;margin-bottom:20px;max-width:540px;
  }
  .sale-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border:1px solid var(--line-soft);background:var(--paper);border-radius:4px;
    padding:10px 12px;margin-bottom:8px;
  }
  .sale-row .crop{font-size:13.5px;font-weight:600;}
  .sale-row .meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .sale-row .amt{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums;text-align:right;flex:none;}
  .sale-row .rate{font-size:11px;color:var(--ink-faint);text-align:right;}

  .toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%);
    background:var(--leaf-deep);
    color:var(--paper);
    padding:10px 18px;
    border-radius:20px;
    font-size:12.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:80vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .steps{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;}
    .steps::before{display:none;}
    .step{flex:none;flex-direction:column;align-items:center;text-align:center;width:84px;}
    .grid-form{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="wordmark">
      <span class="mark">C</span>
      <div>
        <h1>CertiFarm</h1>
        <div class="tagline">Grown honest. Verified by neighbours. Paid what it's worth.</div>
      </div>
    </div>
    <div class="header-right">Running against this session's own ledger data, not a mockup. Nothing here leaves your device.</div>
  </div>

  <div class="mode-switch" id="modeSwitch">
    <button type="button" class="mode-btn active" data-mode="operator">Operator view</button>
    <button type="button" class="mode-btn" data-mode="farmer">Farmer view</button>
  </div>
  <div class="mode-note" id="modeNote"></div>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <nav class="steps" id="steps"></nav>
    <div class="panel" id="panel"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "certifarm:state";

  var COMMUNITIES = [
    "Ga West","Ga South","Ga East","Madina","Kaneshie","Agbogbloshie","Dodowa",
    "Nsawam","Adenta","Ashaiman","Teshie","Nungua","Ablekuma","Amasaman","Kasoa",
    "Weija","Oyibi","Dome","Achimota","Pokuase"
  ];
  var CROPS = [
    "Tomato","Pepper (Kpakpo Shito)","Okra","Garden Egg","Kontomire (Cocoyam Leaves)",
    "Cassava","Cabbage","Carrot","Onion","Lettuce","Cucumber","Watermelon","Pineapple",
    "Plantain","Yam","Maize","Groundnut","Ginger","Moringa","Pawpaw"
  ];
  var STAGES = [
    "Nursery / seedling","Transplanting","Vegetative growth","Flowering",
    "Fruiting","Harvest-ready","Post-harvest handling"
  ];

  var STEPS = [
    {id:"register", name:"Register", desc:"Add a farmer"},
    {id:"verify",   name:"Verify",   desc:"Peer group vouches"},
    {id:"grow",     name:"Grow",     desc:"Log planting stages"},
    {id:"harvest",  name:"Harvest",  desc:"Log a lot"},
    {id:"pool",     name:"Pool",     desc:"Group lots"},
    {id:"label",    name:"Label",    desc:"Issue a QR"},
    {id:"scan",     name:"Scan",     desc:"Trace a label"}
  ];

  var state = {
    farmers: [],    // {id, name, community, crop, verified, verifier, verifiedDate}
    growthLogs: [],  // {id, farmerId, stage, caption, date, photo}
    harvests: [],   // {id, farmerId, qty, date, pooled}
    pools: [],      // {id, harvestIds, date}
    labels: [],     // {id, poolId, retailer, date}
    sales: []       // {id, farmerId, crop, qty, amount, buyer, date, labelId}
  };

  var current = "register";
  var mode = "operator";      // "operator" | "farmer"
  var farmerViewId = null;    // which farmer is "logged in", in farmer mode

  function uid(prefix){
    return prefix + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  }
  function today(){
    return new Date().toISOString().slice(0,10);
  }
  function fmtDate(s){
    var d = new Date(s + "T00:00:00");
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  // ---------------- persistence ----------------
  async function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        state = Object.assign(state, JSON.parse(raw));
      }
    }catch(e){
      // no saved state yet, or storage unavailable (private browsing, etc.)
    }
    renderAll();
  }
  async function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error("Could not save ledger state", e);
      showToast("Storage limit reached — try a smaller photo");
    }
  }

  // ---------------- combobox helper (type + suggest) ----------------
  // Renders a text input backed by a <datalist> so the user can type freely
  // while still seeing filtered suggestions as they go.
  function comboHTML(id, labelText, options, placeholder, hint){
    var listId = id + "-list";
    return '<div class="field">'+
      '<label for="'+id+'">'+esc(labelText)+'</label>'+
      '<input id="'+id+'" list="'+listId+'" type="text" autocomplete="off" placeholder="'+esc(placeholder||"Start typing…")+'">'+
      '<datalist id="'+listId+'">'+ options.map(function(o){ return '<option value="'+esc(o)+'">'; }).join("") +'</datalist>'+
      (hint ? '<span class="hint">'+esc(hint)+'</span>' : '')+
    '</div>';
  }
  // For comboboxes that must resolve to an existing record (farmer, batch):
  // options are {id, label}. Returns the matching id, or null if no exact match.
  function resolveCombo(inputVal, options){
    var v = (inputVal||"").trim().toLowerCase();
    if(!v) return null;
    var hit = options.filter(function(o){ return o.label.toLowerCase()===v; })[0];
    return hit ? hit.id : null;
  }

  // ---------------- seed demo data ----------------
  function seedDemo(){
    var f1 = {id: uid("FRM"), name:"Abena Owusu", community:"Ga West", crop:"Tomato", verified:true, verifier:"Kojo Mensah (PGS)", verifiedDate: today()};
    var f2 = {id: uid("FRM"), name:"Yaw Boateng", community:"Ga West", crop:"Tomato", verified:true, verifier:"Kojo Mensah (PGS)", verifiedDate: today()};
    var f3 = {id: uid("FRM"), name:"Efua Sarpong", community:"Madina", crop:"Pepper (Kpakpo Shito)", verified:false, verifier:null, verifiedDate:null};
    state.farmers.push(f1, f2, f3);

    state.growthLogs.push(
      {id: uid("GRW"), farmerId:f1.id, stage:"Nursery / seedling", caption:"First seedlings transplanted after peer verification.", date: today(), photo:null},

  // ---------------- derived lookups ----------------
  function farmerById(id){ return state.farmers.filter(function(f){return f.id===id;})[0]; }
  function poolById(id){ return state.pools.filter(function(p){return p.id===id;})[0]; }
  function harvestById(id){ return state.harvests.filter(function(h){return h.id===id;})[0]; }
  function labelById(id){ return state.labels.filter(function(l){return l.id===id;})[0]; }
  function growthByFarmer(id){ return state.growthLogs.filter(function(g){return g.farmerId===id;}); }
  function salesByFarmer(id){ return state.sales.filter(function(s){return s.farmerId===id;}); }
  function farmerLabels(farmerId){
    var myLotIds = state.harvests.filter(function(h){return h.farmerId===farmerId;}).map(function(h){return h.id;});
    var myPoolIds = state.pools.filter(function(p){
      return p.harvestIds.some(function(id){ return myLotIds.indexOf(id)!==-1; });
    }).map(function(p){return p.id;});
    return state.labels.filter(function(l){ return myPoolIds.indexOf(l.poolId)!==-1; });
  }

  // ---------------- 3. Grow (planting-stage journal) ----------------
  function readAndCompressImage(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale));
        var h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

            '</div>'+
          '</div>'+
          '<button class="primary-btn" id="g-submit">Add to growth journal</button>')+

    el.innerHTML =

      '<p class="sub">Lots from several farmers can share one batch — mixing is allowed, as long as every lot inside stays disclosed and traceable.</p>'+

      '<div class="section-title">Batches</div>'+
      '<div class="rows" id="p-batches"></div>';

    if(unpooled.length){
      document.getElementById("p-submit").addEventListener("click", function(){
        var checked = Array.prototype.slice.call(document.querySelectorAll(".p-check:checked")).map(function(c){return c.value;});
        if(checked.length===0){ showToast("Select at least one lot to pool"); return; }
        var pool = {id: uid("BATCH"), harvestIds:checked, date: today()};
        state.pools.push(pool);
        checked.forEach(function(id){ harvestById(id).pooled = true; });
        saveState();
        renderAll();
        current = "pool";
        showToast("Batch created from "+checked.length+" lot"+(checked.length>1?"s":""));
      });
    }

    var batchList = document.getElementById("p-batches");
    if(state.pools.length===0){
      batchList.innerHTML = '<div class="empty">No batches yet.</div>';
    } else {
      batchList.innerHTML = state.pools.slice().reverse().map(function(p){
        var lots = p.harvestIds.map(harvestById).filter(Boolean);
        var farmers = lots.map(function(h){return farmerById(h.farmerId);}).filter(Boolean);
        var names = Array.from(new Set(farmers.map(function(f){return f.name;}))).join(", ");
        var totalKg = lots.reduce(function(s,h){return s+Number(h.qty||0);},0);
        var labeled = state.labels.some(function(l){return l.poolId===p.id;});
        return '<div class="row"><div><div class="name">'+p.id+'</div><div class="meta">'+lots.length+' lot(s) · '+totalKg+' kg · '+esc(names)+'</div></div>'+
          '<span class="badge '+(labeled?"gold":"pending")+'">'+(labeled?"Labeled":"Unlabeled")+'</span></div>';
      }).join("");
    }
  }

  // ---------------- QR rendering (genuine, scannable) ----------------
  var qrSeq = 0;
  function traceUrl(labelId){
    return location.origin + location.pathname + "?trace=" + encodeURIComponent(labelId);
  }

  function renderQrInto(containerEl, text, size){
    if(!containerEl) return;
    containerEl.innerHTML = "";
    if(typeof QRCode !== "undefined"){
      try{
        new QRCode(containerEl, {
          text:text,
          width:size||84,
          height:size||84,
          colorDark:"#1D2419",
          colorLight:"#F6F7EE",
          correctLevel: QRCode.CorrectLevel.M
        });
        return;
      }catch(e){ /* fall through to fallback */ }
    }
    // offline fallback if the QR library hasn't loaded
    containerEl.textContent = "QR unavailable offline";
    containerEl.style.fontSize = "9px";
    containerEl.style.color = "var(--ink-faint)";
    containerEl.style.padding = "6px";
  }

  // ---------------- 6. Label ----------------
  function renderLabel(el){
    var labelable = state.pools.filter(function(p){ return !state.labels.some(function(l){return l.poolId===p.id;}); });
    var poolOptions = labelable.map(function(p){ return {id:p.id, label:p.id+" — "+p.harvestIds.length+" lot(s)"}; });

    el.innerHTML =
      '<h2>Issue a label</h2>'+
      '<p class="sub">A retailer licenses a label for a batch. The QR below is genuine and scannable — it links straight to this label\'s trace page on this deployment.</p>'+
      (labelable.length===0
        ? '<div class="empty">'+(state.pools.length===0 ? "Pool some harvest lots first." : "Every batch already has a label.")+'</div>'
        : '<div class="grid-form">'+
            comboHTML("l-pool","Batch", poolOptions.map(function(o){return o.label;}), "Start typing a batch ID…")+
            '<div class="field full"><label for="l-retailer">Retailer / stall</label><input id="l-retailer" type="text" list="retailer-names" placeholder="e.g. Madina Market — Stall 14"></div>'+
            '<datalist id="retailer-names">'+ Array.from(new Set(state.labels.map(function(l){return l.retailer;}))).map(function(r){return '<option value="'+esc(r)+'">';}).join("") +'</datalist>'+
          '</div>'+
          '<button class="primary-btn" id="l-submit">Generate label</button>')+
      '<div class="section-title">Issued labels</div>'+
      '<div id="l-list"></div>';

    if(labelable.length){
      document.getElementById("l-submit").addEventListener("click", function(){
        var poolId = resolveCombo(document.getElementById("l-pool").value, poolOptions);
        if(!poolId){ showToast("Pick a batch from the suggestions"); return; }
        var retailer = document.getElementById("l-retailer").value.trim();
        if(!retailer){ showToast("Enter a retailer or stall name"); return; }
        var id = "CF-" + new Date().getFullYear() + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
        state.labels.push({id:id, poolId:poolId, retailer:retailer, date:today()});
        saveState();
        renderAll();
        current = "label";
        showToast("Label "+id+" issued");
      });
    }

    var list = document.getElementById("l-list");
    if(state.labels.length===0){
      list.innerHTML = '<div class="empty">No labels issued yet.</div>';
    } else {
      list.innerHTML = state.labels.slice().reverse().map(function(l){
        var boxId = "qr-" + (qrSeq++);
        return '<div class="label-card" style="margin-bottom:10px;">'+
          '<div><div class="qr" id="'+boxId+'"></div><div class="qr-note">opens this label\'s trace page</div></div>'+
          '<div><div class="id">'+l.id+'</div><div class="desc">'+esc(l.retailer)+' · issued '+fmtDate(l.date)+'</div>'+
          '<button class="ghost-btn" style="margin-top:8px;" data-trace="'+l.id+'">Trace this label →</button></div>'+
        '</div>';
      }).join("");
      // render each QR after markup is in the DOM
      var cards = state.labels.slice().reverse();
      Array.prototype.forEach.call(list.querySelectorAll(".qr"), function(box, idx){
        renderQrInto(box, traceUrl(cards[idx].id), 88);
      });
      Array.prototype.forEach.call(list.querySelectorAll("[data-trace]"), function(btn){
        btn.addEventListener("click", function(){
          current = "scan";
          renderAll();
          var input = document.getElementById("s-input");
          if(input){ input.value = btn.getAttribute("data-trace"); runTrace(input.value); }
        });
      });
    }
  }

  // ---------------- 7. Scan / Trace ----------------
  function renderScan(el){
    var labelOptions = state.labels.map(function(l){ return {id:l.id, label:l.id}; });
    el.innerHTML =
      '<h2>Trace a label</h2>'+
      '<p class="sub">This is the moment a shopper gets at the point of sale: scan a code, see exactly who grew it and who vouched for them.</p>'+
      '<div class="trace-search">'+
        '<input id="s-input" list="label-ids" type="text" placeholder="Enter a label ID, e.g. CF-2026-AB12">'+
        '<datalist id="label-ids">'+ labelOptions.map(function(o){return '<option value="'+esc(o.label)+'">';}).join("") +'</datalist>'+
        '<button class="primary-btn" id="s-go">Trace</button>'+
      '</div>'+
      (state.labels.length ? '<div class="quick-picks">'+ state.labels.map(function(l){return '<button data-pick="'+l.id+'">'+l.id+'</button>';}).join("") +'</div>' : '')+
      '<div id="s-result" style="margin-top:18px;"></div>';

    document.getElementById("s-go").addEventListener("click", function(){
      runTrace(document.getElementById("s-input").value.trim());
    });
    document.getElementById("s-input").addEventListener("keydown", function(e){
      if(e.key==="Enter") runTrace(e.target.value.trim());
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-pick]"), function(btn){
      btn.addEventListener("click", function(){
        document.getElementById("s-input").value = btn.getAttribute("data-pick");
        runTrace(btn.getAttribute("data-pick"));
      });
    });
  }

  function runTrace(code){
    var result = document.getElementById("s-result");
    if(!result) return;
    if(!code){ result.innerHTML = '<div class="empty">Enter a label ID above.</div>'; return; }
    var label = labelById(code);
    if(!label){
      result.innerHTML = '<div class="empty">No record for "'+esc(code)+'". Check the code, or issue a label first.</div>';
      return;
    }
    var pool = poolById(label.poolId);
    var lots = pool.harvestIds.map(harvestById).filter(Boolean);
    var farmers = lots.map(function(h){return farmerById(h.farmerId);}).filter(Boolean);
    var uniqueFarmers = [];
    farmers.forEach(function(f){ if(!uniqueFarmers.some(function(u){return u.id===f.id;})) uniqueFarmers.push(f); });
    var totalKg = lots.reduce(function(s,h){return s+Number(h.qty||0);},0);

    result.innerHTML =
      '<div class="trace-result">'+
        '<div class="trace-head"><div><div class="id">'+label.id+'</div><div class="meta">'+esc(label.retailer)+'</div></div>'+
          '<div><div class="qr" id="trace-qr"></div><div class="qr-note">this label\'s live link</div></div></div>'+
        '<div class="trust-list">'+
          '<div class="trust-item"><span class="tick">✓</span> Verified by a peer group before harvest, not a paid inspector</div>'+
          '<div class="trust-item"><span class="tick">✓</span> Batch traced to '+uniqueFarmers.length+' named farmer(s), '+totalKg+' kg total</div>'+
          '<div class="trust-item"><span class="tick">✓</span> Every hand-off logged from farm gate to this stall</div>'+
        '</div>'+
        '<div class="section-title" style="margin-top:0;">Farmers in this batch</div>'+
        uniqueFarmers.map(function(f){
          var logs = growthByFarmer(f.id).sort(function(a,b){return a.date<b.date?-1:1;});
          return '<div class="farm-card"><div class="name">'+esc(f.name)+'</div>'+
            '<div class="meta">'+esc(f.community)+' · grows '+esc(f.crop)+' · vouched by '+esc(f.verifier)+' on '+fmtDate(f.verifiedDate)+'</div>'+
            (logs.length ? '<div class="grow-strip">'+ logs.map(function(g){
              return g.photo
                ? '<img class="grow-thumb" src="'+g.photo+'" title="'+esc(g.stage)+' · '+fmtDate(g.date)+'" alt="'+esc(g.stage)+'">'
                : '<div class="grow-thumb placeholder" title="'+esc(g.stage)+' · '+fmtDate(g.date)+'">🌱</div>';
            }).join("") +'</div>' : '')+
          '</div>';
        }).join("")+
        '<div class="custody">'+
          '<span class="hop">Farmer</span><span class="arrow">→</span>'+
          '<span class="hop">Aggregator</span><span class="arrow">→</span>'+
          '<span class="hop">Transporter</span><span class="arrow">→</span>'+
          '<span class="hop">'+esc(label.retailer)+'</span><span class="arrow">→</span>'+
          '<span class="hop">You</span>'+
        '</div>'+
      '</div>';

    renderQrInto(document.getElementById("trace-qr"), traceUrl(label.id), 88);
  }

  // ---------------- boot ----------------
  Array.prototype.forEach.call(document.querySelectorAll(".mode-btn"), function(btn){
    btn.addEventListener("click", function(){
      mode = btn.getAttribute("data-mode");
      Array.prototype.forEach.call(document.querySelectorAll(".mode-btn"), function(b){ b.classList.toggle("active", b===btn); });
      renderAll();
    });
  });

  loadState().then(function(){
    var params = new URLSearchParams(location.search);
    var traceParam = params.get("trace");
    if(traceParam){
      mode = "operator";
      current = "scan";
      Array.prototype.forEach.call(document.querySelectorAll(".mode-btn"), function(b){
        b.classList.toggle("active", b.getAttribute("data-mode")==="operator");
      });
      renderAll();
      var input = document.getElementById("s-input");
      if(input){ input.value = traceParam; runTrace(traceParam); }
    }
  });

})();
</script>
</body>
</html>
